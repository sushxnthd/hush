<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Supakeep responsive verification</title><style>body{margin:24px;background:#e8e8eb;font:14px system-ui}header{display:flex;align-items:center;gap:20px;margin-bottom:20px}select{font:inherit;padding:8px}iframe{display:block;width:390px;height:800px;border:1px solid #bbb;background:#f4f4f6}pre{white-space:pre-wrap;font-size:12px}</style></head><body><header><label>Viewport <select id="width"><option>320</option><option selected>390</option><option>600</option><option>768</option><option>1000</option></select></label><label>Page <select id="page"><option value="../">Home</option><option value="../product/">Product</option><option value="../writing/">Writing</option><option value="../changelog/">Changelog</option></select></label></header><iframe id="frame" title="Responsive website preview" src="../"></iframe><pre id="result" aria-live="polite"></pre><script>const frame=document.getElementById('frame'),width=document.getElementById('width'),page=document.getElementById('page'),result=document.getElementById('result');function inspect(){const doc=frame.contentDocument;result.textContent=JSON.stringify({viewport:frame.clientWidth,contentWidth:doc.documentElement.scrollWidth,overflow:doc.documentElement.scrollWidth>frame.clientWidth,font:frame.contentWindow.getComputedStyle(doc.querySelector('h1')).fontFamily},null,2)}width.addEventListener('change',()=>{frame.style.width=width.value+'px';requestAnimationFrame(inspect)});page.addEventListener('change',()=>{frame.src=page.value});frame.addEventListener('load',inspect);</script></body></html>
