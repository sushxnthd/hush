<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f6">
<title>Hush — Private Mode for every AI</title>
<meta name="description" content="Hush is the user-owned trust layer between you and every AI.">
<style>html,body{margin:0;min-height:100%;background:#f4f4f6}</style>
</head>
<body>
<script>
(async()=>{
  const parts=await Promise.all([0,1,2,3,4,5].map(async i=>{
    const r=await fetch(`replica/${i}.b64?v=3`,{cache:'no-cache'});
    if(!r.ok) throw new Error(`replica/${i}.b64: ${r.status}`);
    return (await r.text()).trim();
  }));
  const binary=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();

  // Preserve the source-exact visual payload while removing mirror/runtime artifacts.
  html=html
    .replace(/^html(?=<html)/,'')
    .replace(/<script(?:\s[^>]*)?>[\s\S]*?<\/script>/g,'');

  // Critical fixes are CSS-only and fail-open: no visibility guard can leave the site blank.
  const integrity=`
    <style id="hush-integrity-css">
      .cookie-bar,.cookie-panel,[data-cookie-consent],[data-cookie-dialog],.dials{display:none!important}
      .field .still{display:block!important;width:100%!important;height:100%!important;object-fit:cover!important}
      .field .film{display:none!important}
    </style>`;

  html=html.replace('</head>',`${integrity}</head>`);
  html=html.replace('</body>','<script src="assets/replica-fix.js?v=fb6e79de"></script><script src="assets/replica-polish.js?v=c9ea6722"></script><script src="assets/replica-qa.js?v=f7a09710"></script></body>');

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  console.error(err);
  document.body.innerHTML='<main style="font:16px system-ui;padding:40px;color:#0b1015;max-width:720px;margin:0 auto"><h1 style="font-size:28px;margin:0 0 12px">Hush</h1><p>The site hit a loading error. Refresh once; if it persists, the static fallback will be restored.</p></main>';
});
</script>
</body>
</html>
