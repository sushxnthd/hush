<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f6">
<title>Hush — Private Mode for every AI</title>
<meta name="description" content="Hush is the user-owned trust layer between you and every AI.">
<style>html,body{margin:0;min-height:100%;background:#f4f4f6}</style>
</head>
<body>
<script>
(async()=>{
  const parts=await Promise.all([0,1,2,3,4,5].map(async i=>{
    const r=await fetch(`replica/${i}.b64?v=2`,{cache:'no-cache'});
    if(!r.ok) throw new Error(`replica/${i}.b64: ${r.status}`);
    return (await r.text()).trim();
  }));
  const binary=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  const stream=new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'));
  let html=await new Response(stream).text();

  // The compressed payload is the source-exact visual replica. Strip its old shim and
  // make only Hush integrity corrections before first paint.
  html=html
    .replace(/<script(?:\s[^>]*)?>[\s\S]*?<\/script>/g,'')
    .replaceAll('learner-1','Hush kernel')
    .replaceAll('Markdown memory','semantic-only baseline')
    .replaceAll('FAIL_TO_PASS','completeness');

  html=html.replace('</head>','<style id="hush-prepaint">html{visibility:hidden}</style><style id="hush-polish-guard">html{visibility:hidden}</style></head>');
  html=html.replace('</body>','<script src="assets/replica-fix.js?v=fb6e79de" onerror="document.getElementById(\'hush-prepaint\')?.remove()"></script><script src="assets/replica-polish.js?v=6da744c5" onerror="document.getElementById(\'hush-polish-guard\')?.remove()"></script></body>');

  document.open();
  document.write(html);
  document.close();
})().catch(err=>{
  console.error(err);
  document.body.innerHTML='<main style="font:16px system-ui;padding:40px;color:#0b1015">Hush failed to load. Refresh the page.</main>';
});
</script>
</body>
</html>
