name: Multi-page site routing

on:
  push:
    paths:
      - '.github/workflows/split-site-pages.yml'

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split website into real pages
        run: |
          echo '' | base64 -d > /tmp/split_pages.py
          python3 /tmp/split_pages.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html product/index.html writing/index.html changelog/index.html
          git commit -m "Split website into dedicated pages"
          git push
