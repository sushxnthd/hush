name: Integrate partition privacy API

on:
  push:
    paths:
      - '.github/workflows/apply-partition-api.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration and validate
        run: |
          python3 scripts/apply-partition-api.py
          node --check src/server.js
          npm test
          npm run bench
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js package.json
          git commit -m "Integrate partition-aware privacy into local API"
          git push
