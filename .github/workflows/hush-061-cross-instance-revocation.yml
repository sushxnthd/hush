name: HUSH-061 durable broker revocation
on:
  push:
    branches: [breakthrough-engine/transaction-scope-recovery-20261021]
    paths:
      - 'src/action-broker.js'
      - 'test/action-broker-cross-instance-revocation.test.js'
      - '.github/workflows/hush-061-cross-instance-revocation.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/action-broker-cross-instance-revocation.test.js test/action-broker-postdispatch-private-result.test.js test/action-broker-expiry-after-await.test.js
