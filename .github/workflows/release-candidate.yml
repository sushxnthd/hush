name: release-candidate

on:
  push:
    branches: [production/v1.0-hardening]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: portable-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Syntax gate
        run: npm run check:syntax
      - name: Unit and security tests
        run: npm test
      - name: Build portable release candidate
        env:
          SOURCE_DATE_EPOCH: '1791331200'
        run: npm run release:build
      - name: Independently verify release manifest, SBOM and checksums
        run: npm run release:verify
      - name: Fresh-directory recovery drill
        run: npm run ops:recovery
      - name: Update rollback drill
        run: npm run ops:rollback
      - name: Crash/restart durability smoke
        env:
          HUSH_SOAK_DURATION_MS: '15000'
        run: npm run ops:soak
      - name: Inspect release summary and drill evidence
        run: node -e "const fs=require('fs');for(const f of ['dist/release-summary.json','dist/evidence/release-integrity.json','dist/evidence/recovery-drill.json','dist/evidence/rollback-drill.json','dist/evidence/soak.json']){const x=JSON.parse(fs.readFileSync(f,'utf8'));if(f.includes('evidence')&&x.status!=='pass')process.exit(1);console.log(f,x.status||x.version||x)}"
      - uses: actions/upload-artifact@v7
        with:
          name: hush-portable-${{ runner.os }}-${{ github.sha }}
          path: |
            dist/hush-0.9.0-portable
            dist/release-summary.json
            dist/evidence
          if-no-files-found: error
          retention-days: 14

  research-benchmarks:
    name: frozen-research-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run bench
