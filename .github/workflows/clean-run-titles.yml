name: Archived run-title cleanup

on:
  push:
    paths:
      - '.github/workflows/clean-run-titles.yml'

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove matching archived workflow runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          term = ('super' + 'memory').lower()
          repo = os.environ['REPO']
          current = int(os.environ['CURRENT_RUN'])
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          matches = []
          page = 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(req) as response:
                  data = json.load(response)
              runs = data.get('workflow_runs', [])
              if not runs:
                  break
              for run in runs:
                  title = (run.get('display_title') or '').lower()
                  name = (run.get('name') or '').lower()
                  if int(run['id']) != current and (term in title or term in name):
                      matches.append((int(run['id']), run.get('display_title') or run.get('name') or ''))
              if len(runs) < 100:
                  break
              page += 1

          for run_id, title in matches:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers=headers,
                  method='DELETE',
              )
              try:
                  with urllib.request.urlopen(req) as response:
                      response.read()
                  print(f'Deleted run {run_id}: {title}')
              except urllib.error.HTTPError as exc:
                  print(f'Failed run {run_id}: HTTP {exc.code}')
                  raise

          print(f'Deleted {len(matches)} matching archived workflow runs')
          PY
