name: Apply privacy accounting precision hardening

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-precision.yml'
      - 'scripts/apply-accounting-precision.py'
      - 'test/symbolic-runtime.test.js'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply precision hardening and validate
        run: |
          python3 scripts/apply-accounting-precision.py
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/partition-firewall.js src/joint-choice-firewall.js src/private-decision.js
          git commit -m "Preserve exact privacy accounting precision"
          git push
