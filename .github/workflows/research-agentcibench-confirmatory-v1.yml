name: research-agentcibench-confirmatory-v1

on:
  push:
    branches:
      - research/agentcibench-confirmatory-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  FROZEN_HUSH_SHA: 565e07e4ddfd2dd9f51ca69f0bcae2920d63878f
  AGENTCIBENCH_SHA: 7b3fad424d0c5a450ac3bc3dc4050c38094c6dc6
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  confirmatory-frozen-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact frozen Hush evaluator
        uses: actions/checkout@v4
        with:
          ref: 565e07e4ddfd2dd9f51ca69f0bcae2920d63878f
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact frozen CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check 'transformers==4.46.3' 'safetensors==0.4.5' 'numpy==2.1.3'
      - name: Fetch exact independent AgentCIBench revision
        run: |
          git clone --filter=blob:none https://github.com/UKPLab/emnlp2026-agentcibench.git agentcibench
          git -C agentcibench checkout --detach "${AGENTCIBENCH_SHA}"
          test "$(git -C agentcibench rev-parse HEAD)" = "${AGENTCIBENCH_SHA}"
      - name: Run one-shot frozen confirmatory evaluator
        id: evaluator
        run: |
          set +e
          python research/external/agentcibench_confirmatory_v1.py \
            --holdout-dir agentcibench/data/eval_set_e2e_50 \
            --output agentcibench-confirmatory-v1.json | tee agentcibench-confirmatory-v1.txt
          code=${PIPESTATUS[0]}
          echo "${code}" > agentcibench-confirmatory-v1.exit
          if [ -f agentcibench-confirmatory-v1.json ]; then sha256sum agentcibench-confirmatory-v1.json > agentcibench-confirmatory-v1.sha256; fi
          exit 0
      - name: Record immutable provenance
        if: always()
        run: |
          {
            echo "workflow_sha=${GITHUB_SHA}"
            echo "frozen_hush_sha=${FROZEN_HUSH_SHA}"
            echo "checked_out_hush_sha=$(git rev-parse HEAD)"
            echo "agentcibench_sha=$(git -C agentcibench rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import importlib.metadata as m
          for p in ['torch','transformers','safetensors','numpy']:
              print(f'{p}={m.version(p)}')
          PY
          } | tee agentcibench-confirmatory-v1-runtime.txt
          test "$(git rev-parse HEAD)" = "${FROZEN_HUSH_SHA}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hush-agentcibench-confirmatory-v1-frozen-565e07e4
          path: |
            agentcibench-confirmatory-v1.json
            agentcibench-confirmatory-v1.txt
            agentcibench-confirmatory-v1.sha256
            agentcibench-confirmatory-v1.exit
            agentcibench-confirmatory-v1-runtime.txt
          if-no-files-found: warn
      - name: Interpret evaluator exit without moving scientific gates
        if: always()
        run: |
          if [ ! -f agentcibench-confirmatory-v1.exit ]; then
            echo 'Technical evaluator error: no exit record.' >&2
            exit 1
          fi
          code="$(cat agentcibench-confirmatory-v1.exit)"
          if [ "${code}" = '1' ]; then
            echo 'Technical evaluator error.' >&2
            exit 1
          elif [ "${code}" = '2' ]; then
            echo 'Scientific superiority gate failed; result is preserved and this holdout is spent.'
          elif [ "${code}" = '0' ]; then
            echo 'All frozen AgentCIBench superiority gates passed.'
          else
            echo "Unexpected evaluator exit ${code}." >&2
            exit 1
          fi
