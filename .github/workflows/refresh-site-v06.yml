name: Refresh v0.6 website

on:
  push:
    paths:
      - '.github/workflows/refresh-site-v06.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update site content
        run: |
          python3 scripts/refresh-site-v06.py
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html product/index.html writing/index.html changelog/index.html
          git commit -m "Update website for v0.6 privacy kernel"
          git push
