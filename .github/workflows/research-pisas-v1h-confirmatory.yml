name: research-pisas-v1h-confirmatory

on:
  push:
    branches:
      - research/pisas-v1h-confirmatory
  workflow_dispatch:

permissions:
  contents: read

env:
  PISAS_SHA: 8a1ba30ba210d4a430bbd25cf4a3500d0e22c5b9
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  confirmatory:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile frozen evaluator
        run: python -m py_compile research/external/pisas_v1h_confirmatory.py
      - name: Install pinned local runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check 'transformers==4.46.3' 'safetensors==0.4.5' 'numpy==2.1.3' 'huggingface_hub==0.36.0'
      - name: Download exact public PiSAs snapshot
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          root = snapshot_download('ServiceNow/PiSAs', repo_type='dataset', revision=os.environ['PISAS_SHA'], local_dir='pisas-dataset')
          print('pisas_root=' + root)
          PY
      - name: Run one-shot frozen PiSAs cross-benchmark
        id: evaluator
        run: |
          set +e
          python research/external/pisas_v1h_confirmatory.py \
            --dataset-root pisas-dataset \
            --output pisas-v1h-confirmatory.json | tee pisas-v1h-confirmatory.txt
          code=${PIPESTATUS[0]}
          echo "${code}" > pisas-v1h-confirmatory.exit
          if [ -f pisas-v1h-confirmatory.json ]; then sha256sum pisas-v1h-confirmatory.json > pisas-v1h-confirmatory.sha256; fi
          exit 0
      - name: Record provenance
        if: always()
        run: |
          {
            echo "hush_sha=$(git rev-parse HEAD)"
            echo "pisas_dataset_sha=${PISAS_SHA}"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import importlib.metadata as m
          for p in ['torch','transformers','safetensors','numpy','huggingface_hub']:
              print(f'{p}={m.version(p)}')
          PY
          } | tee pisas-v1h-confirmatory-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hush-pisas-v1h-${{ github.sha }}
          path: |
            pisas-v1h-confirmatory.json
            pisas-v1h-confirmatory.txt
            pisas-v1h-confirmatory.sha256
            pisas-v1h-confirmatory.exit
            pisas-v1h-confirmatory-runtime.txt
          if-no-files-found: warn
      - name: Interpret scientific result
        if: always()
        run: |
          test -f pisas-v1h-confirmatory.exit || { echo 'No evaluator exit record' >&2; exit 1; }
          code="$(cat pisas-v1h-confirmatory.exit)"
          if [ "${code}" = '1' ]; then
            echo 'Technical/integrity error.' >&2
            exit 1
          elif [ "${code}" = '2' ]; then
            echo 'Frozen PiSAs run completed but one or more preregistered scientific gates failed.'
          elif [ "${code}" = '0' ]; then
            echo 'Frozen PiSAs run passed every preregistered scientific gate.'
          else
            echo "Unexpected evaluator exit ${code}." >&2
            exit 1
          fi
