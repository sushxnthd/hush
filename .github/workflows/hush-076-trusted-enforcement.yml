name: HUSH-076 trusted certificate enforcement
on:
  pull_request:
    paths:
      - 'src/action-broker.js'
      - 'test/action-broker-trusted-enforcement-076.test.js'
      - '.github/workflows/hush-076-trusted-enforcement.yml'
      - 'research/pcc-v2/HUSH_076_*'
  workflow_dispatch:
jobs:
  adversarial-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: HUSH-076 trusted-policy real HTTP and tampering tests
        run: node --test test/action-broker-trusted-enforcement-076.test.js
      - name: Existing broker and scope regressions
        run: node --test test/action-broker.test.js test/action-broker-required-certificate-074.test.js test/action-broker-adapter-generation-075.test.js test/transaction-scope-enforcement.test.js test/action-broker-observable-closure.test.js
