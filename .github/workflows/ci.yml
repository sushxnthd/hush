name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm test
      - run: npm run check:syntax
      - run: npm run dashboard:build
      - run: npm run site:build
      - run: npm run site:verify
      - run: npm run launch:smoke
        if: runner.os == 'Linux'
      - name: Crash and restart all 20 persistence boundaries
        if: runner.os == 'Linux'
        env:
          HUSH_SOAK_DURATION_MS: '60000'
          HUSH_SOAK_MAX_ITERATIONS: '20'
        run: |
          npm run ops:soak
          node -e "const x=require('./dist/evidence/soak.json');if(x.status!=='pass'||!x.coverageComplete||x.crashes<20)process.exit(1)"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run bench
