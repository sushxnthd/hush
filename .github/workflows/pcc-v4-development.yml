name: pcc-v4-development
on:
  push:
    branches: [research/pcc-v4-development]
    paths:
      - 'research/pcc-v4/**'
      - '.github/workflows/pcc-v4-development.yml'
permissions:
  contents: read
jobs:
  develop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PCC v4 abstraction-safety invariants
        run: |
          node --test research/pcc-v3/policy_compiler_v3.test.mjs
          node --test research/pcc-v4/policy_compiler_v4.test.mjs
      - name: Download exact POLAR release
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path('/tmp/polar.json');u='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          with urllib.request.urlopen(u,timeout=180) as r,p.open('wb') as f:
            while True:
              b=r.read(1024*1024)
              if not b: break
              f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest();e='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266'
          print('dataset_sha256='+h)
          if h!=e: raise SystemExit('hash mismatch')
          PY
      - name: Diagnose P3 conditional misses
        run: node research/pcc-v4/p3_miss_diagnostics.mjs /tmp/polar.json
      - name: Regress PCC v4 across P1-P3 development regimes
        run: node research/pcc-v4/dev_regression.mjs /tmp/polar.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcc-v4-development
          path: research/pcc-v4/out/
          if-no-files-found: error
