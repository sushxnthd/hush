name: Trace envelope minimality

on:
  push:
    branches: [breakthrough-engine/pcc-cleanroom-replication]
    paths:
      - research/pcc-runtime-product/TRACE_ENVELOPE_MINIMALITY_PREREGISTRATION.md
      - research/pcc-runtime-product/TRACE_ENVELOPE_MINIMALITY_RESULT.md
      - research/pcc-runtime-product/verify_trace_envelope_minimality.py
      - research/pcc-runtime-product/audit_trace_envelope_minimality.py
      - src/trace-risk-ledger.js
      - test/trace-risk-ledger.test.js
      - .github/workflows/trace-envelope-minimality.yml
  pull_request:
    paths:
      - research/pcc-runtime-product/TRACE_ENVELOPE_MINIMALITY_PREREGISTRATION.md
      - research/pcc-runtime-product/TRACE_ENVELOPE_MINIMALITY_RESULT.md
      - research/pcc-runtime-product/verify_trace_envelope_minimality.py
      - research/pcc-runtime-product/audit_trace_envelope_minimality.py
      - src/trace-risk-ledger.js
      - test/trace-risk-ledger.test.js
      - .github/workflows/trace-envelope-minimality.yml

jobs:
  exact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 research/pcc-runtime-product/verify_trace_envelope_minimality.py --output /tmp/trace-envelope.json
      - run: python3 research/pcc-runtime-product/audit_trace_envelope_minimality.py /tmp/trace-envelope.json | tee /tmp/trace-envelope-audit.json
      - run: node --test test/trace-risk-ledger.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: trace-envelope-minimality
          path: |
            /tmp/trace-envelope.json
            /tmp/trace-envelope-audit.json
