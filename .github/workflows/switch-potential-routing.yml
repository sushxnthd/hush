name: Switch potential routing frozen study
on:
  push:
    branches: [breakthrough-engine/pcc-cleanroom-replication]
    paths:
      - research/pcc-runtime-product/SWITCH_POTENTIAL_ROUTING_PREREGISTRATION.md
      - research/pcc-runtime-product/verify_switch_potential_routing.py
      - research/pcc-runtime-product/audit_switch_potential_routing.py
      - .github/workflows/switch-potential-routing.yml
  workflow_dispatch:
jobs:
  frozen-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute frozen verifier
        run: python research/pcc-runtime-product/verify_switch_potential_routing.py --output research/pcc-runtime-product/switch_potential_routing_result.json
      - name: Independent audit
        run: python research/pcc-runtime-product/audit_switch_potential_routing.py research/pcc-runtime-product/switch_potential_routing_result.json | tee research/pcc-runtime-product/switch_potential_routing_audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: switch-potential-routing-frozen-result
          path: |
            research/pcc-runtime-product/switch_potential_routing_result.json
            research/pcc-runtime-product/switch_potential_routing_audit.json
          if-no-files-found: error
