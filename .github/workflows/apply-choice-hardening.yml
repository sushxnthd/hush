name: Apply choice privacy hardening

on:
  push:
    paths:
      - '.github/workflows/apply-choice-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening and validate
        run: |
          python3 scripts/apply-choice-hardening.py
          node --check src/private-decision.js
          node --check src/joint-choice-firewall.js
          npm test
          npm run bench
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/private-decision.js src/joint-choice-firewall.js
          git commit -m "Harden protected choice accounting"
          git push
