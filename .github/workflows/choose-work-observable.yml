name: choose-work-observable

on:
  push:
    branches: [breakthrough-engine/choose-work-observable-20261018]
    paths:
      - src/private-decision.js
      - research/pcc-runtime-product/CHOOSE_WORK_OBSERVABLE_*.md
      - research/pcc-runtime-product/run_choose_work_observable_probe.mjs
      - research/pcc-runtime-product/audit_choose_work_observable.py
      - .github/workflows/choose-work-observable.yml
  pull_request:
    paths:
      - src/private-decision.js
      - research/pcc-runtime-product/CHOOSE_WORK_OBSERVABLE_*.md
      - research/pcc-runtime-product/run_choose_work_observable_probe.mjs
      - research/pcc-runtime-product/audit_choose_work_observable.py
      - .github/workflows/choose-work-observable.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-work-channel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute exact witness twice
        run: |
          node research/pcc-runtime-product/run_choose_work_observable_probe.mjs /tmp/work-1.json
          node research/pcc-runtime-product/run_choose_work_observable_probe.mjs /tmp/work-2.json
          cmp /tmp/work-1.json /tmp/work-2.json
          cp /tmp/work-1.json research/pcc-runtime-product/choose_work_observable_result.json
      - name: Independent enumeration and source audit
        run: python research/pcc-runtime-product/audit_choose_work_observable.py
      - name: Preserve exact result
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/pcc-runtime-product/choose_work_observable_result.json research/pcc-runtime-product/choose_work_observable_audit.json
          git commit -m "research: record choose work-observable counterexample"
          git push origin HEAD:$GITHUB_REF_NAME
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: choose-work-observable
          path: |
            /tmp/work-1.json
            research/pcc-runtime-product/choose_work_observable_audit.json
