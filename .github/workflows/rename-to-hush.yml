name: rename-to-hush

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rename-to-hush.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rename product across tracked text files
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          helper = ".github/workflows/rename-to-hush.yml"
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          changed = []

          for name in filter(None, files):
              if name == helper:
                  continue
              path = Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue

              new = (text
                     .replace("SUPAKEEP", "HUSH")
                     .replace("Supakeep", "Hush")
                     .replace("supakeep", "hush"))

              # Keep the existing repository and Pages URLs valid until the
              # repository slug is renamed from supakeep to hush.
              new = new.replace("github.com/sushxnthd/hush", "github.com/sushxnthd/supakeep")
              new = new.replace("github.io/hush", "github.io/supakeep")

              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(name)

          old_test = Path("test/supakeep.test.js")
          new_test = Path("test/hush.test.js")
          if old_test.exists():
              old_test.rename(new_test)
              changed.append(f"{old_test} -> {new_test}")

          print("Changed:")
          for item in changed:
              print(f"  {item}")
          PY

      - name: Verify old brand only remains in legacy repository URLs
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          helper = ".github/workflows/rename-to-hush.yml"
          allowed = (
              "github.com/sushxnthd/supakeep",
              "sushxnthd.github.io/supakeep",
          )
          bad = []
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in filter(None, files):
              if name == helper:
                  continue
              path = Path(name)
              if not path.exists():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if re.search(r"supakeep", line, re.I) and not any(x in line for x in allowed):
                      bad.append(f"{name}:{lineno}: {line}")
          if bad:
              print("Unexpected old-brand references remain:")
              print("\n".join(bad))
              raise SystemExit(1)
          PY

      - name: Run checks
        run: npm run check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Rename Supakeep product to Hush"
          git push
