name: Hush PCC-055 transitive receipt-hash disclosure
on:
  push:
    branches:
      - breakthrough-engine/transaction-scope-recovery-20261021
    paths:
      - 'test/action-broker-receipt-hash-transitive-channel.test.js'
      - 'research/pcc-v2/HUSH_055_*.md'
      - '.github/workflows/hush-055-receipt-hash.yml'
      - 'src/action-broker.js'
      - 'src/core.js'
      - 'scripts/production-readiness.mjs'
  workflow_dispatch:
jobs:
  transitive-hash-falsification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify redacted-receipt transitive dictionary leak and allowlist control
        run: node --test test/action-broker-receipt-hash-transitive-channel.test.js
      - name: Preserve direct digest and preapproval hash negative controls
        run: |
          node --test test/action-broker-postapproval-result-digest-channel.test.js
          node --test test/action-broker-preapproval-hash-channel.test.js
      - name: Ensure strict production release remains blocked
        run: |
          set +e
          node scripts/production-readiness.mjs --json > /tmp/hush055-readiness.json
          status=$?
          set -e
          test "$status" -ne 0
          node -e "const r=require('/tmp/hush055-readiness.json');if(r.status!=='block')process.exit(1)"
