name: polar-p1-development-diagnostics
on:
  push:
    branches: [research/polar-p1-confirmatory]
    paths:
      - 'research/polar-p1/diagnose.mjs'
      - 'research/polar-p1/inspect-policies.mjs'
      - '.github/workflows/polar-p1-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download frozen POLAR release
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request
          url='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          p=pathlib.Path('/tmp/polar.json')
          with urllib.request.urlopen(url,timeout=180) as r, p.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          expected='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266'
          print('dataset_sha256='+h)
          if h != expected: raise SystemExit('Frozen dataset hash mismatch')
          PY
      - name: Diagnose failed P1 confirmation as development data
        run: node research/polar-p1/diagnose.mjs /tmp/polar.json
      - name: Inspect one development policy shape per domain
        run: node research/polar-p1/inspect-policies.mjs /tmp/polar.json
      - uses: actions/upload-artifact@v4
        with:
          name: polar-p1-development-diagnostics
          path: research/polar-p1/out/development-diagnostics.json
          if-no-files-found: error
