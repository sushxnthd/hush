name: pcc-v2-p2-confirmatory
on:
  push:
    branches: [research/pcc-v2-p2-confirmatory]
    paths:
      - 'research/pcc-v2/policy_compiler_v2.mjs'
      - 'research/pcc-v2/P2_PREREGISTRATION.md'
      - 'research/pcc-v2/p2_evaluate.mjs'
      - 'research/pcc-v2/p2_evaluate.test.mjs'
      - 'research/pcc-v2/p2_finalize.mjs'
      - '.github/workflows/pcc-v2-p2-confirmatory.yml'
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096
  PCC_V2_COMPILER_COMMIT: dd8f7e4aa1c307c6cf81512e7eb212f0ba003d31
jobs:
  confirm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Freeze invariants before confirmatory outputs
        run: node --test research/pcc-v2/p2_evaluate.test.mjs
      - name: Download exact frozen POLAR release
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path('/tmp/polar.json');u='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          with urllib.request.urlopen(u,timeout=180) as r,p.open('wb') as f:
            while True:
              b=r.read(1024*1024)
              if not b:break
              f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest();e='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266'
          print('dataset_sha256='+h)
          if h!=e:raise SystemExit('Frozen dataset hash mismatch')
          PY
      - name: Confirmatory run 1
        run: node research/pcc-v2/p2_evaluate.mjs --input /tmp/polar.json --out research/pcc-v2/out/p2-run1.json
      - name: Confirmatory run 2
        run: node research/pcc-v2/p2_evaluate.mjs --input /tmp/polar.json --out research/pcc-v2/out/p2-run2.json
      - name: Finalize frozen gates and reproduction
        run: node research/pcc-v2/p2_finalize.mjs research/pcc-v2/out/p2-run1.json research/pcc-v2/out/p2-run2.json research/pcc-v2/out/p2-final.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcc-v2-p2-confirmatory
          path: research/pcc-v2/out/
          if-no-files-found: error
          retention-days: 90
