name: Apply connected posterior composition

on:
  push:
    paths:
      - '.github/workflows/apply-connected-posterior.yml'
      - 'scripts/apply-connected-posterior.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch and validate
        run: |
          python3 scripts/apply-connected-posterior.py
          node --check src/symbolic-choice-counter.js
          node --check src/private-decision.js
          npm test
          npm run bench
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/symbolic-choice-counter.js src/private-decision.js
          git commit -m "Compose protected outputs through connected posterior"
          git push
