name: pcc-v2-freeze-regression
on:
  push:
    branches: [research/pcc-v2-development]
    paths:
      - 'research/pcc-v2/policy_compiler_v2.mjs'
      - 'research/pcc-v2/p1_regression.mjs'
      - '.github/workflows/pcc-v2-freeze-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Download exact POLAR release
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path('/tmp/polar.json');u='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          with urllib.request.urlopen(u,timeout=180) as r,p.open('wb') as f:
            while True:
              b=r.read(1024*1024)
              if not b:break
              f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest();e='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266'
          print('dataset_sha256='+h)
          if h!=e:raise SystemExit('hash mismatch')
          PY
      - run: node research/pcc-v2/p1_regression.mjs /tmp/polar.json
