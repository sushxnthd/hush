name: research-agentleak-secretless-v1

on:
  push:
    branches:
      - research/agentleak-external-gate-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AGENTLEAK_SHA: d5267c79c8a4333a2a149ffed2ec62f1864932e5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate paired traces from the production ActionBroker
        run: node bench/agentleak-secretless-traces.js agentleak-secretless-traces.json
      - name: Install pinned independent AgentLeak analyzer
        run: python -m pip install --disable-pip-version-check "git+https://github.com/yagobski/agentleak.git@${AGENTLEAK_SHA}"
      - name: Analyze paired traces
        run: |
          python research/external/agentleak_secretless_v1.py \
            agentleak-secretless-traces.json \
            --output agentleak-secretless-v1.json | tee agentleak-secretless-v1.txt
          sha256sum agentleak-secretless-v1.json > agentleak-secretless-v1.sha256
      - name: Record provenance
        run: |
          {
            echo "hush_sha=$(git rev-parse HEAD)"
            echo "agentleak_sha=${AGENTLEAK_SHA}"
            echo "node=$(node --version)"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import agentleak
          print(f'agentleak={agentleak.__version__}')
          PY
          } | tee agentleak-secretless-v1-runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hush-agentleak-secretless-v1-${{ github.sha }}
          path: |
            agentleak-secretless-v1.json
            agentleak-secretless-v1.txt
            agentleak-secretless-v1.sha256
            agentleak-secretless-v1-runtime.txt
          if-no-files-found: error
