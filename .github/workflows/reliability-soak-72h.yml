name: reliability-soak-72h

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact commit/ref to soak; leave blank for the selected ref"
        required: false
        type: string
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  soak:
    name: exact-candidate-72h-soak
    runs-on: ubuntu-latest
    timeout-minutes: 4320
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Run full 72-hour crash/restart soak
        env:
          GITHUB_SHA: ${{ github.sha }}
          HUSH_SOAK_DURATION_MS: "259200000"
          HUSH_SOAK_REQUIRE_FULL_DURATION: "1"
          HUSH_SOAK_MAX_ITERATIONS: "1000000"
        run: npm run ops:soak
      - name: Inspect full-duration evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('dist/evidence/soak.json','utf8'));
          if(report.status!=='pass'||report.commit!==process.env.GITHUB_SHA||report.full72HourSatisfied!==true||report.coverageComplete!==true||report.totalCrashes<20)process.exit(1);
          console.log(JSON.stringify({status:report.status,commit:report.commit,activeMs:report.cumulativeActiveMs,wallMs:report.wallMs,totalCrashes:report.totalCrashes,coverageComplete:report.coverageComplete},null,2));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hush-72h-soak-${{ github.sha }}
          path: dist/evidence/soak.json
          if-no-files-found: error
          retention-days: 14
