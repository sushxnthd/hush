name: pcc-v2-p2-development
on:
  push:
    branches: [research/pcc-v2-p2-development]
    paths:
      - 'research/pcc-v2/policy_compiler_v2.mjs'
      - 'research/pcc-v2/p2_diagnose.mjs'
      - '.github/workflows/pcc-v2-p2-development.yml'
permissions:
  contents: read
env:
  PCC_V2_COMPILER_COMMIT: ${{ github.sha }}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Download exact POLAR release
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path('/tmp/polar.json');u='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          with urllib.request.urlopen(u,timeout=180) as r,p.open('wb') as f:
            while True:
              b=r.read(1024*1024)
              if not b:break
              f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest();e='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266'
          print('dataset_sha256='+h)
          if h!=e:raise SystemExit('hash mismatch')
          PY
      - name: Preserve P1 development regression
        run: node research/pcc-v2/p1_regression.mjs /tmp/polar.json
      - name: Diagnose P2 development misses
        run: node research/pcc-v2/p2_diagnose.mjs /tmp/polar.json
      - name: Score updated compiler on P2 development data
        run: node research/pcc-v2/p2_evaluate.mjs --input /tmp/polar.json --out research/pcc-v2/out/p2-dev-eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: pcc-v2-p2-development
          path: research/pcc-v2/out/
          if-no-files-found: error
