name: research-pisas-metadata

on:
  push:
    branches:
      - research/pisas-v1h-confirmatory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve PiSAs dataset revision only
        run: |
          python -m pip install --disable-pip-version-check 'huggingface_hub==0.36.0'
          python - <<'PY'
          from huggingface_hub import HfApi
          info = HfApi().dataset_info('ServiceNow/PiSAs')
          print('pisas_dataset_sha=' + str(info.sha))
          print('pisas_last_modified=' + str(info.last_modified))
          print('pisas_private=' + str(info.private))
          PY
