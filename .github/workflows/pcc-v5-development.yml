name: pcc-v5-development
on:
  push:
    branches: [research/pcc-v5-development]
    paths:
      - 'research/pcc-v5/**'
      - '.github/workflows/pcc-v5-development.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact POLAR release
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path('/tmp/polar.json');u='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          with urllib.request.urlopen(u,timeout=180) as r,p.open('wb') as f:
            while True:
              b=r.read(1024*1024)
              if not b: break
              f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest();e='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266'
          print('dataset_sha256='+h)
          if h!=e: raise SystemExit('hash mismatch')
          PY
      - name: Diagnose P4 compositional misses
        run: node research/pcc-v5/p4_miss_diagnostics.mjs /tmp/polar.json
      - uses: actions/upload-artifact@v4
        with:
          name: pcc-v5-p4-diagnostics
          path: research/pcc-v5/out/
          if-no-files-found: error
