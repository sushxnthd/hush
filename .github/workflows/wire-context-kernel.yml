name: Wire native private-context MCP

on:
  push:
    paths:
      - '.github/workflows/wire-context-kernel.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add native MCP routing
        run: |
          python3 scripts/patch-native-mcp.py
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js package.json
          git commit -m "Expose bounded private computation through MCP"
          git push
