name: HUSH-057 broker-owned credential output redaction
on:
  push:
    branches:
      - breakthrough-engine/transaction-scope-recovery-20261021
    paths:
      - 'test/action-broker-credential-output-redaction.test.js'
      - 'src/action-broker.js'
      - '.github/workflows/hush-057-credential-output.yml'
      - 'research/pcc-v2/HUSH_057_*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  broker-owned-output-adversaries:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce prepatch credential leak (temporary negative-control phase)
        env:
          HUSH057_EXPECT_LEAK: '1'
        run: node --test test/action-broker-credential-output-redaction.test.js
