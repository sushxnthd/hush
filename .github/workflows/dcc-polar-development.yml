name: dcc-polar-development
on:
  push:
    branches: [research/disclosure-closure-compiler]
    paths:
      - 'src/disclosure-closure-compiler.js'
      - 'research/dcc/polar-development.mjs'
      - 'research/dcc/probe-opened-p1.mjs'
      - '.github/workflows/dcc-polar-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  develop:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact POLAR development release
        run: |
          python - <<'PY'
          import hashlib,pathlib,urllib.request
          p=pathlib.Path('/tmp/polar.json')
          u='https://huggingface.co/datasets/Qiaoyuan/POLAR-Bench/resolve/main/data/privacy_benchmark_rendered_repaired.json?download=true'
          with urllib.request.urlopen(u,timeout=180) as r,p.open('wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          h=hashlib.sha256(p.read_bytes()).hexdigest();print('dataset_sha256='+h)
          if h!='b1db0274228b1346df47d0a42bb75f9536ded1a6d750bb2720f43612c7abb266': raise SystemExit('hash mismatch')
          PY
      - name: Probe remaining opened-P1 policy shapes
        run: node research/dcc/probe-opened-p1.mjs /tmp/polar.json
      - name: Run development evaluation
        run: node research/dcc/polar-development.mjs /tmp/polar.json
      - uses: actions/upload-artifact@v4
        with:
          name: dcc-polar-development
          path: research/dcc/out/polar-development.json
          if-no-files-found: error
