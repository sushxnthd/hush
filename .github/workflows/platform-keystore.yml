name: platform-keystore

on:
  push:
    branches: [production/v1.0-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: packaged-keystore-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Build exact portable artifact
        env:
          SOURCE_DATE_EPOCH: '1791331200'
        run: npm run release:build
      - name: Verify packaged production keystore without plaintext fallback
        if: runner.os != 'Linux'
        run: node scripts/packaged-keystore-verify.mjs
      - name: Install Linux Secret Service test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - name: Verify packaged Linux production keystore in an isolated session
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/linux-keystore-session.sh
      - uses: actions/upload-artifact@v7
        with:
          name: hush-packaged-keystore-${{ runner.os }}-${{ github.sha }}
          path: dist/evidence
          if-no-files-found: error
          retention-days: 14
