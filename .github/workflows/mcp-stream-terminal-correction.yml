name: mcp-stream-terminal-correction

on:
  push:
    branches: [breakthrough-engine/mcp-stream-terminal-correction-20261018]
  pull_request:
    paths:
      - src/server.js
      - test/mcp-get-mediation.test.js
      - research/pcc-runtime-product/*MCP_STREAM_TERMINAL_CORRECTION*.md
      - research/pcc-runtime-product/*mcp_stream_terminal_correction*
      - research/pcc-runtime-product/run_mcp_get_fail_closed_correction.mjs
      - .github/workflows/mcp-stream-terminal-correction.yml
  workflow_dispatch:

jobs:
  adversarial-terminal-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce all five lifecycle cases twice
        run: |
          node research/pcc-runtime-product/run_mcp_stream_terminal_correction.mjs /tmp/terminal-1.json
          node research/pcc-runtime-product/run_mcp_stream_terminal_correction.mjs /tmp/terminal-2.json
          cmp /tmp/terminal-1.json /tmp/terminal-2.json
          cmp /tmp/terminal-1.json research/pcc-runtime-product/mcp_stream_terminal_correction_result.json
      - name: Independent result and source-order audit
        run: |
          cp research/pcc-runtime-product/mcp_stream_terminal_correction_audit.json /tmp/expected-audit.json
          python research/pcc-runtime-product/audit_mcp_stream_terminal_correction.py
          cmp research/pcc-runtime-product/mcp_stream_terminal_correction_audit.json /tmp/expected-audit.json
      - name: Focused legacy-contract migration
        run: node --test test/mcp-get-mediation.test.js
      - name: Full regression suite
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-stream-terminal-correction
          path: |
            /tmp/terminal-1.json
            research/pcc-runtime-product/mcp_stream_terminal_correction_audit.json
