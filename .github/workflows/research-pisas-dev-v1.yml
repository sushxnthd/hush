name: research-pisas-dev-v1

on:
  push:
    branches:
      - research/pisas-v1
  workflow_dispatch:

permissions:
  contents: read

env:
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  pisas-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned local retrieval runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check 'transformers==4.46.3' 'safetensors==0.4.5' 'numpy==2.1.3' 'huggingface_hub==0.36.2'
      - name: Resolve and download exact public PiSAs dataset snapshot
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi, snapshot_download
          from pathlib import Path
          info=HfApi().dataset_info('ServiceNow/PiSAs')
          sha=info.sha
          root=snapshot_download('ServiceNow/PiSAs',repo_type='dataset',revision=sha)
          Path('pisas-dataset-sha.txt').write_text(sha+'\n',encoding='utf-8')
          Path('pisas-dataset-root.txt').write_text(root+'\n',encoding='utf-8')
          print('dataset_sha='+sha)
          print('dataset_root='+root)
          PY
      - name: Run development-only Hush PiSAs sweep
        id: evaluator
        run: |
          set +e
          root="$(cat pisas-dataset-root.txt)"
          rev="$(cat pisas-dataset-sha.txt)"
          python research/external/pisas_context_dev_v1.py \
            --dataset-root "${root}" \
            --dataset-revision "${rev}" \
            --output pisas-dev-v1.json | tee pisas-dev-v1.txt
          code=${PIPESTATUS[0]}
          echo "${code}" > pisas-dev-v1.exit
          if [ -f pisas-dev-v1.json ]; then sha256sum pisas-dev-v1.json > pisas-dev-v1.sha256; fi
          exit 0
      - name: Record runtime provenance
        if: always()
        run: |
          {
            echo "hush_sha=$(git rev-parse HEAD)"
            echo "pisas_code_sha=52611d0cb6eac6e13a80c5716fd9cfd02e0ee155"
            echo "pisas_dataset_sha=$(cat pisas-dataset-sha.txt 2>/dev/null || true)"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import importlib.metadata as m
          for p in ['torch','transformers','safetensors','numpy','huggingface_hub']:
              print(f'{p}={m.version(p)}')
          PY
          } | tee pisas-dev-v1-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hush-pisas-dev-v1-${{ github.sha }}
          path: |
            pisas-dev-v1.json
            pisas-dev-v1.txt
            pisas-dev-v1.sha256
            pisas-dev-v1.exit
            pisas-dev-v1-runtime.txt
            pisas-dataset-sha.txt
          if-no-files-found: warn
      - name: Interpret development exit
        if: always()
        run: |
          if [ ! -f pisas-dev-v1.exit ]; then
            echo 'Technical evaluator error: no exit record.' >&2
            exit 1
          fi
          code="$(cat pisas-dev-v1.exit)"
          if [ "${code}" = '1' ]; then
            echo 'Technical evaluator error.' >&2
            exit 1
          elif [ "${code}" = '2' ]; then
            echo 'No development configuration crossed the preregistered utility floor yet.'
          elif [ "${code}" = '0' ]; then
            echo 'At least one PiSAs development configuration is eligible for freeze.'
          else
            echo "Unexpected evaluator exit ${code}." >&2
            exit 1
          fi
