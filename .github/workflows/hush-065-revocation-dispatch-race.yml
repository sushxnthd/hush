name: HUSH-065 revocation-dispatch effect-boundary counterexample

on:
  push:
    branches:
      - breakthrough-engine/transaction-scope-recovery-20261021
    paths:
      - 'src/action-broker.js'
      - 'test/action-broker-revocation-dispatch-race.test.js'
      - '.github/workflows/hush-065-revocation-dispatch-race.yml'
  pull_request:
    paths:
      - 'src/action-broker.js'
      - 'test/action-broker-revocation-dispatch-race.test.js'
      - '.github/workflows/hush-065-revocation-dispatch-race.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expected security counterexample, not a passing security certificate
        run: node --test test/action-broker-revocation-dispatch-race.test.js
