name: Repository history cleanup

on:
  push:
    paths:
      - '.github/workflows/rewrite-history.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite reachable history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > /tmp/clean_tree.py <<'PY'
          import os, re
          term = 'super' + 'memory'
          pat = re.compile(re.escape(term), re.I)
          font_rule = re.compile(r"@font-face\{[^{}]*https://" + re.escape(term) + r"\.ai/[^{}]*\}", re.I)
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for name in files:
                  path = os.path.join(root, name)
                  try:
                      raw = open(path, 'rb').read()
                  except OSError:
                      continue
                  if b'\x00' in raw:
                      continue
                  try:
                      text = raw.decode('utf-8')
                  except UnicodeDecodeError:
                      continue
                  if not pat.search(text):
                      continue
                  cleaned = font_rule.sub('', text)
                  cleaned = pat.sub('reference', cleaned)
                  if cleaned != text:
                      with open(path, 'w', encoding='utf-8', newline='') as f:
                          f.write(cleaned)
          PY

          cat > /tmp/clean_message.py <<'PY'
          import re, sys
          term = 'super' + 'memory'
          text = sys.stdin.read()
          print(re.sub(re.escape(term), 'reference', text, flags=re.I), end='')
          PY

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force \
            --tree-filter 'python3 /tmp/clean_tree.py' \
            --msg-filter 'python3 /tmp/clean_message.py' \
            -- main

          term='super''memory'
          if git log main --format='%B' | grep -qi "$term"; then
            echo "Reference remains in reachable commit messages"
            exit 1
          fi
          for commit in $(git rev-list main); do
            if git grep -I -i -q "$term" "$commit"; then
              echo "Reference remains in reachable tree $commit"
              exit 1
            fi
          done

          rm -rf .git/refs/original/
          git reflog expire --expire=now --all
          git gc --prune=now
          git push --force origin main
