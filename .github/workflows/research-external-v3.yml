name: research-external-v3

on:
  workflow_dispatch:
  push:
    branches: [research/external-falsification-v2]
    paths:
      - 'research/EXTERNAL_HOLDOUT_PROTOCOL_V3.md'
      - 'research/EXTERNAL_HOLDOUT_PROTOCOL_V3_AMENDMENT_1.md'
      - 'research/external/privacylens_holdout_v3.py'
      - 'research/external/hush-guard-batch.mjs'
      - 'src/egress-guard.js'
      - 'src/context-sanitizer.js'
      - '.github/workflows/research-external-v3.yml'
  pull_request:
    paths:
      - 'research/EXTERNAL_HOLDOUT_PROTOCOL_V3.md'
      - 'research/EXTERNAL_HOLDOUT_PROTOCOL_V3_AMENDMENT_1.md'
      - 'research/external/privacylens_holdout_v3.py'
      - 'research/external/hush-guard-batch.mjs'
      - 'src/egress-guard.js'
      - 'src/context-sanitizer.js'
      - '.github/workflows/research-external-v3.yml'

permissions:
  contents: read

jobs:
  privacy-lens-holdout:
    runs-on: ubuntu-latest
    env:
      AGENTLEAK_COMMIT: d5267c79c8a4333a2a149ffed2ec62f1864932e5
      PRIVACYLENS_COMMIT: 9c2ee07b080dc54ed4924af11d9751e81753c94d
      PRIVACYLENS_BLOB_SHA: 7992bddb2638bb1fa595c4bf8fb4c82783209e6f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AgentLeak comparator and scorer
        run: python -m pip install --disable-pip-version-check "git+https://github.com/yagobski/agentleak.git@${AGENTLEAK_COMMIT}"
      - name: Fetch immutable PrivacyLens source
        run: |
          curl -fsSL "https://raw.githubusercontent.com/SALT-NLP/PrivacyLens/${PRIVACYLENS_COMMIT}/data/main_data.json" -o privacylens-main-data.json
          actual_blob="$(git hash-object privacylens-main-data.json)"
          echo "PrivacyLens git blob: ${actual_blob}"
          test "${actual_blob}" = "${PRIVACYLENS_BLOB_SHA}"
          sha256sum privacylens-main-data.json | tee privacylens-main-data.sha256
      - name: Run frozen preregistered holdout once
        run: |
          python research/external/privacylens_holdout_v3.py \
            --raw privacylens-main-data.json \
            --output external-v3.json | tee external-v3.txt
          sha256sum external-v3.json | tee external-v3.sha256
      - name: Record runtime and immutable pins
        run: |
          {
            echo "hush_sha=${GITHUB_SHA}"
            echo "agentleak_sha=${AGENTLEAK_COMMIT}"
            echo "privacylens_sha=${PRIVACYLENS_COMMIT}"
            echo "privacylens_blob_sha=${PRIVACYLENS_BLOB_SHA}"
            echo "node=$(node --version)"
            echo "python=$(python --version 2>&1)"
          } | tee external-v3-runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hush-external-v3-${{ github.sha }}
          path: |
            external-v3.json
            external-v3.txt
            external-v3.sha256
            privacylens-main-data.sha256
            external-v3-runtime.txt
          if-no-files-found: error
