name: research-agentcibench-confirmatory-v1h-fresh

on:
  push:
    branches:
      - research/agentcibench-v1h-confirmatory
  workflow_dispatch:

permissions:
  contents: read

env:
  AGENTCIBENCH_SHA: 7b3fad424d0c5a450ac3bc3dc4050c38094c6dc6
  TOKENIZERS_PARALLELISM: 'false'

jobs:
  confirmatory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile frozen confirmatory runner
        run: python -m py_compile research/external/agentcibench_confirmatory_v1h_fresh_runner.py
      - name: Install pinned CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install --disable-pip-version-check 'transformers==4.46.3' 'safetensors==0.4.5' 'numpy==2.1.3'
      - name: Fetch pinned independent AgentCIBench revision
        run: |
          git clone --filter=blob:none https://github.com/UKPLab/emnlp2026-agentcibench.git agentcibench
          git -C agentcibench checkout --detach "${AGENTCIBENCH_SHA}"
          test "$(git -C agentcibench rev-parse HEAD)" = "${AGENTCIBENCH_SHA}"
      - name: Run one-shot frozen fresh confirmatory evaluation
        id: evaluator
        run: |
          set +e
          python research/external/agentcibench_confirmatory_v1h_fresh_runner.py \
            --source-dir agentcibench/data/generated_merged \
            --old-holdout-dir agentcibench/data/eval_set_e2e_50 \
            --output agentcibench-v1h-fresh.json | tee agentcibench-v1h-fresh.txt
          code=${PIPESTATUS[0]}
          echo "${code}" > agentcibench-v1h-fresh.exit
          if [ -f agentcibench-v1h-fresh.json ]; then sha256sum agentcibench-v1h-fresh.json > agentcibench-v1h-fresh.sha256; fi
          exit 0
      - name: Record provenance
        if: always()
        run: |
          {
            echo "hush_sha=$(git rev-parse HEAD)"
            echo "agentcibench_sha=$(git -C agentcibench rev-parse HEAD)"
            echo "python=$(python --version 2>&1)"
            python - <<'PY'
          import importlib.metadata as m
          for p in ['torch','transformers','safetensors','numpy']:
              print(f'{p}={m.version(p)}')
          PY
          } | tee agentcibench-v1h-fresh-runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hush-agentcibench-v1h-fresh-${{ github.sha }}
          path: |
            agentcibench-v1h-fresh.json
            agentcibench-v1h-fresh.txt
            agentcibench-v1h-fresh.sha256
            agentcibench-v1h-fresh.exit
            agentcibench-v1h-fresh-runtime.txt
          if-no-files-found: warn
      - name: Interpret confirmatory result
        if: always()
        run: |
          test -f agentcibench-v1h-fresh.exit || { echo 'No evaluator exit record' >&2; exit 1; }
          code="$(cat agentcibench-v1h-fresh.exit)"
          if [ "${code}" = '1' ]; then
            echo 'Technical/integrity error.' >&2
            exit 1
          elif [ "${code}" = '2' ]; then
            echo 'Frozen v1h fresh confirmatory run completed, but one or more scientific gates failed.'
          elif [ "${code}" = '0' ]; then
            echo 'Frozen v1h fresh confirmatory run passed every preregistered gate.'
          else
            echo "Unexpected evaluator exit ${code}." >&2
            exit 1
          fi
