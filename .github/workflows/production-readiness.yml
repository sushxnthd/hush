name: production-readiness

on:
  push:
    branches: [production/v1.0-hardening, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: strict 10-of-10 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Inspect exact-source release evidence
        shell: bash
        run: |
          set +e
          set -o pipefail
          node scripts/production-readiness.mjs --json | tee production-readiness.json
          status=${PIPESTATUS[0]}
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('production-readiness.json','utf8'));
          const blocked=report.domains.filter(domain=>domain.status!=='pass').map(domain=>`- ${domain.name}`).join('\\n')||'- none';
          const summary=[
            '## Hush production-readiness gate',
            '',
            `- Engineering: **${report.engineering.passed}/${report.engineering.total} (${report.engineering.percent}%)**`,
            `- Release domains: **${report.releaseDomains}/${report.totalDomains}**`,
            '',
            '### Blocked domains',
            blocked,
            '',
            '> Structural validation does not establish external evidence authenticity or release authorization.'
          ].join('\\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\\n');
          NODE
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hush-production-readiness-${{ github.sha }}
          path: production-readiness.json
          if-no-files-found: error
          retention-days: 14
