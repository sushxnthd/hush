name: production-readiness

on:
  push:
    branches: [production/v1.0-hardening, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: strict 10-of-10 gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Inspect exact-source release evidence
        run: node scripts/production-readiness.mjs --json > production-readiness.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: hush-production-readiness-${{ github.sha }}
          path: production-readiness.json
          if-no-files-found: error
          retention-days: 14
