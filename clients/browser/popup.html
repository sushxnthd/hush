<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hush</title>
<style>
:root{color-scheme:light;--bg:#f3f2ed;--card:#fff;--ink:#1f221d;--muted:#73766e;--line:#e2e1d9;--green:#243e2e;--red:#8b3030;--soft:#e7eee8}*{box-sizing:border-box}body{margin:0;width:360px;min-height:520px;background:var(--bg);color:var(--ink);font:13px Inter,system-ui,sans-serif}.wrap{padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:18px;font-weight:850;letter-spacing:-.03em}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#a6aaa1;margin-right:6px}.dot.on{background:#3d7651}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}.eyebrow{font-size:9px;font-weight:850;letter-spacing:.12em;color:#718077}.muted{color:var(--muted)}h2{font-size:16px;margin:5px 0 10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.meta{font-size:11px;color:var(--muted);margin-top:2px}.actions{display:flex;gap:5px}button{border:0;border-radius:8px;padding:7px 9px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer}.deny{background:#fff0f0;color:var(--red);border:1px solid #ecd7d7}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}textarea{width:100%;min-height:82px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:#fbfbf8}.output{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:10px;background:#202620;color:#dbe6dc;padding:10px;min-height:58px;margin-top:8px;font-size:11px}.error{color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:var(--soft);border-radius:10px;padding:9px}.stat b{display:block;font-size:18px}.empty{padding:10px 0;color:var(--muted)}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">hush</div><div><span id="dot" class="dot"></span><span id="connection" class="muted">checking</span></div></div>
  <div class="card">
    <div class="eyebrow">LOCAL TRUST LAYER</div>
    <div class="stats">
      <div class="stat"><span>Waiting</span><b id="waiting">–</b></div>
      <div class="stat"><span>Receipts</span><b id="receipts">–</b></div>
      <div class="stat"><span>AI footprint</span><b id="footprint">–</b></div>
    </div>
  </div>
  <div class="card">
    <div class="eyebrow">APPROVALS</div><h2>Waiting for you</h2>
    <div id="pending"><div class="empty">Loading…</div></div>
  </div>
  <div class="card">
    <div class="eyebrow">PROMPT GUARD</div><h2>Redact before pasting</h2>
    <textarea id="input" placeholder="Paste text here. Processing stays through your local Hush runtime."></textarea>
    <div class="actions" style="margin-top:7px"><button id="redact">Redact</button><button id="copy" class="ghost">Copy result</button></div>
    <div id="output" class="output">Nothing processed yet.</div>
  </div>
  <div id="error" class="error"></div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
